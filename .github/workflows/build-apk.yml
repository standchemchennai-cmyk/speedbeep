name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      refresh_osm:
        description: "Optional: refresh OSM speed limits (use bundled routes if unavailable)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The checked-in offline CSV is always sufficient for an APK.
      # Online map-data refresh is an explicitly requested optional operation.
      - name: Optional OSM speed-limit refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_osm
        timeout-minutes: 3
        run: python3 tools/import_osm_speed_limits.py

      - name: Verify bundled speed-limit database
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("app/src/main/assets/speed_limits.csv")
          if not path.is_file():
              raise SystemExit("ERROR: Offline speed-limit database is missing.")
          with path.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(line for line in f if line.strip() and not line.lstrip().startswith("#")))
          required = {"name", "start_lat", "start_lon", "end_lat", "end_lon", "limit_kph", "corridor_m", "margin_kph"}
          if not rows or not required.issubset(rows[0]):
              raise SystemExit("ERROR: Offline speed-limit database is empty or malformed.")
          print(f"Verified {len(rows)} bundled speed-limit segments.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify speed-limit segment editing logic
        run: |
          mkdir -p /tmp/speedbeep-core
          javac -d /tmp/speedbeep-core \
            app/src/main/java/com/utk/speedbeep/RoadSegment.java \
            app/src/main/java/com/utk/speedbeep/GeoMatcher.java \
            app/src/main/java/com/utk/speedbeep/CsvRoadRepository.java \
            app/src/main/java/com/utk/speedbeep/RoadLimitEditor.java \
            app/src/main/java/com/utk/speedbeep/OSMRoadNetwork.java \
            app/src/main/java/com/utk/speedbeep/GpsRoadFallback.java \
            app/src/main/java/com/utk/speedbeep/LocalRoadEditMatcher.java \
            app/src/main/java/com/utk/speedbeep/MapStretchRouter.java \
            app/src/main/java/com/utk/speedbeep/ManualRoadTrace.java \
            app/src/main/java/com/utk/speedbeep/SpeedLimitPolicy.java \
            app/src/main/java/com/utk/speedbeep/RoadProfileNames.java \
            host-test/TestCore.java host-test/TestRoadLimitEditor.java \
            host-test/TestOSMRoadNetwork.java host-test/TestGpsRoadFallback.java \
            host-test/TestLocalRoadEditMatcher.java host-test/TestMapStretchRouter.java \
            host-test/TestManualRoadTrace.java host-test/TestSpeedLimitPolicy.java \
            host-test/TestRoadProfileNames.java
          java -cp /tmp/speedbeep-core TestCore
          java -cp /tmp/speedbeep-core TestRoadLimitEditor
          java -cp /tmp/speedbeep-core TestOSMRoadNetwork
          java -cp /tmp/speedbeep-core TestGpsRoadFallback
          java -cp /tmp/speedbeep-core TestLocalRoadEditMatcher
          java -cp /tmp/speedbeep-core TestMapStretchRouter
          java -cp /tmp/speedbeep-core TestManualRoadTrace
          java -cp /tmp/speedbeep-core TestSpeedLimitPolicy
          java -cp /tmp/speedbeep-core TestRoadProfileNames

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SpeedBeep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload speed-limit database
        uses: actions/upload-artifact@v6
        with:
          name: SpeedBeep-speed-database
          path: app/src/main/assets/speed_limits.csv
          if-no-files-found: error
          retention-days: 30
