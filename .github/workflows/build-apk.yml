name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh explicit OSM speed limits
        run: python tools/import_osm_speed_limits.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload generated speed database
        uses: actions/upload-artifact@v4
        with:
          name: SpeedBeep-speed-database
          path: app/src/main/assets/speed_limits.csv

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedBeep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
